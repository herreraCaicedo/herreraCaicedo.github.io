<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
  %3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E
    %3Crect width='100' height='100' fill='%23b00020'/%3E
    %3Ctext x='50' y='75' font-size='70' text-anchor='middle' fill='white' font-family='Arial, sans-serif'%3EH%3C/text%3E
  %3C/svg%3E">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alejandro Herrera-Caicedo</title>
  <script>if (localStorage.getItem("mode") !== "dark") { document.documentElement.classList.add("light"); }</script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: transparent;
    }

    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 750px;
      min-height: 100vh;
      margin: 0 auto;
      zoom: 1.4;
      line-height: 1.6;
      font-size: 15px;
      transition: all 0.4s ease-in-out;
    }

    h1 {
      font-size: 1.25rem;
      color: #fff;
      margin-bottom: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 0.3px;
      line-height: 1.3;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      transition: color 0.3s ease;
    }

    nav {
      display: flex;
      gap: 20px;
      margin-bottom: 60px;
    }

    nav a {
      text-decoration: none;
      color: #71717a;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #ffffff;
    }

    .intro, .contact {
      margin-bottom: 40px;
    }

    .intro p, .contact p {
      color: #a1a1aa;
    }

    .contact a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #262626;
    }

    .contact a:hover {
      border-bottom-color: #ffffff;
    }

    .footer {
      margin-top: auto;
      padding-top: 60px;
      font-size: 12px;
      color: #71717a;
      text-transform: uppercase;
    }

    .toggle-btn {
      margin-left: auto;
      padding: 4px 8px;
      font-family: Consolas, monospace;
      font-size: 12px;
      background-color: #000;
      color: #ffffff;
      border: 1px solid #ffffff;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      background-color: #ffffff;
      color: #000;
      border: 1px solid #ffffff;
    }

    /* Light Mode Styles */
    .content-panel {
      position: relative;
      background-color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 80px 20px;
    }

    .light,
    html.light body {
      background-color: #ffffff !important;
      color: #000000 !important;
    }

    .light .content-panel {
      background-color: #ffffff !important;
    }

    .light h1 {
      color: #000000 !important;
    }

    .light nav a {
      color: #666666 !important;
    }

    .light nav a:hover,
    .light nav a.active {
      color: #000000 !important;
    }

    .light .intro p,
    .light .contact p {
      color: #333333 !important;
    }

    .light .contact a {
      color: #000000 !important;
      border-bottom: 1px solid #cccccc !important;
    }

    .light .contact a:hover {
      border-bottom-color: #000000 !important;
    }

    .light .footer {
      color: #666666 !important;
    }

    .light .toggle-btn {
      background-color: #ffffff !important;
      color: #000000 !important;
      border: 1px solid #000000 !important;
    }

    .light .toggle-btn:hover {
      background-color: #000000 !important;
      color: #ffffff !important;
      border: 1px solid #000000 !important;
    }

    .intro-contact {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    @media (max-width: 640px) {
      .content-panel { padding: 60px 16px; }
      h1 { font-size: 2.2rem; }
      nav { gap: 10px; flex-wrap: wrap; }
      .intro-contact { flex-direction: column !important; gap: 20px !important; }
    }

    /* Dither hyphen */
    #dither-hyphen {
      cursor: pointer;
      transition: opacity 0.15s;
      user-select: none;
    }
    #dither-hyphen:hover {
      opacity: 0.5;
    }

    body.dither-active { background-color: transparent !important; }

    /* Dither background canvas */
    #dither-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
      image-rendering: pixelated;
      background-color: #000;
    }

    #dither-bg.visible {
      opacity: 1;
    }

    /* In light mode, invert the dither so it shows black-on-white */
    html.light #dither-bg {
      filter: invert(1);
    }
  </style>
</head>
<body>

  <!-- Full-page dither canvas (behind everything) -->
  <canvas id="dither-bg"></canvas>

  <div class="content-panel">
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="research.html">Research</a>
    <a href="teaching.html">Teaching</a>
    <a href="CV.pdf">CV</a>
    <button class="toggle-btn" onclick="toggleLightMode()">Light</button>
  </nav>

  <h1>Alejandro Herrera<span id="dither-hyphen" title="click me">-</span>Caicedo</h1>

  <div class="intro-contact">
    <div class="intro">
      <p>
        Fourth year student in Economics at UW-Madison studying industrial organization, labor economics, and public policy.
      </p>
    </div>

    <div class="contact">
      <p><a href="mailto:herreracaice@wisc.edu">herreracaice@wisc.edu</a></p>
      <p>7439 Social Sciences</p>
      <p>UW Madison</p>
    </div>
  </div>

  <div class="footer">
    Last updated: April 2026
  </div>
  </div>

<script>
  document.querySelector('.toggle-btn').textContent =
    document.documentElement.classList.contains("light") ? 'Dark' : 'Light';

  function toggleLightMode() {
    const isLight = document.documentElement.classList.toggle('light');
    document.querySelector('.toggle-btn').textContent = isLight ? 'Dark' : 'Light';
    if (isLight) {
      localStorage.removeItem("mode");
    } else {
      localStorage.setItem("mode", "dark");
    }
  }

  // ── Dither wave ──────────────────────────────────────────────────────────────
  const ditherCanvas = document.getElementById('dither-bg');
  const hyphen = document.getElementById('dither-hyphen');

  let ditherActive = false;
  let ditherRunning = false;
  let ditherT = parseFloat(localStorage.getItem("ditherT")) || 1;
  let ditherRAF = null;

  // Size canvas to viewport
  function resizeDither() {
    ditherCanvas.width  = Math.ceil(window.innerWidth  / 2);
    ditherCanvas.height = Math.ceil(window.innerHeight / 2);
    initDither();
  }

  let NX, NY, xs, ys, f, edge, px, img, ctx;

  const bayer = [
    0,32,8,40,2,34,10,42,
    48,16,56,24,50,18,58,26,
    12,44,4,36,14,46,6,38,
    60,28,52,20,62,30,54,22,
    3,35,11,43,1,33,9,41,
    51,19,59,27,49,17,57,25,
    15,47,7,39,13,45,5,37,
    63,31,55,23,61,29,53,21
  ].map(v => v / 63);

  function initDither() {
    NX = ditherCanvas.width;
    NY = ditherCanvas.height;
    ctx = ditherCanvas.getContext('2d');
    img = ctx.createImageData(NX, NY);
    px  = img.data;
    xs  = new Float32Array(NX);
    ys  = new Float32Array(NY);
    for (let i = 0; i < NX; i++) xs[i] = -1.5 + 3 * i / (NX - 1);
    for (let j = 0; j < NY; j++) ys[j] = -1.0 + 2 * j / (NY - 1);
    f    = new Float32Array(NX * NY);
    edge = new Float32Array(NX * NY);
  }

  const cl = (x, lo = 0, hi = 1) => x < lo ? lo : x > hi ? hi : x;

  function renderDither(t) {
    const c1x = Math.cos(t * .055) * .55, c1y = Math.sin(t * .042) * .40;
    const c2x = Math.cos(t * .037 + 2) * .50, c2y = Math.sin(t * .060 + 1) * .45;
    const ph1 = t * .08, ph2 = t * .065, ph3 = t * .04;

    for (let j = 0; j < NY; j++) {
      const y = ys[j];
      const dy1 = y - c1y, dy2 = y - c2y;
      const sy28 = Math.sin(y * 2.8 + ph3);
      const sy7  = y * 7.0;
      for (let i = 0; i < NX; i++) {
        const x  = xs[i];
        const R1 = Math.sqrt((x - c1x) ** 2 + dy1 ** 2);
        const R2 = Math.sqrt((x - c2x) ** 2 + dy2 ** 2);
        const w  = 0.42 * Math.sin(R1 * 11 - ph1)
                 + 0.30 * Math.sin(R2 * 9  - ph2)
                 + 0.16 * Math.sin(x * 5.5 + sy28 * 2 + ph3)
                 + 0.10 * Math.sin(sy7 + Math.cos(x * 2.4 + ph3 * .5) * 1.6)
                 + 0.06 * Math.sin((x + y) * 6 + ph2 * .4);
        let v = cl(w * .5 + .5);
        v = cl((v - .2) / .6);
        f[j * NX + i] = v;
      }
    }

    for (let j = 0; j < NY; j++) {
      for (let i = 0; i < NX; i++) {
        const ip  = i ? i - 1 : 0, ip2 = i < NX - 1 ? i + 1 : NX - 1;
        const jp  = j ? j - 1 : 0, jp2 = j < NY - 1 ? j + 1 : NY - 1;
        const gx  = f[j * NX + ip2] - f[j * NX + ip];
        const gy  = f[jp2 * NX + i] - f[jp * NX + i];
        edge[j * NX + i] = cl((Math.sqrt(gx * gx + gy * gy) - .18) / .20);
      }
    }

    for (let j = 0; j < NY; j++) {
      for (let i = 0; i < NX; i++) {
        const thr = bayer[(j % 8) * 8 + (i % 8)];
        const bit = (f[j * NX + i] > thr) || (edge[j * NX + i] > 0.5);
        const v   = bit ? 0 : 255;
        const k   = (j * NX + i) * 4;
        px[k] = px[k + 1] = px[k + 2] = v;
        px[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function ditherLoop() {
    if (!ditherRunning) return;
    renderDither(ditherT);
    ditherT += 0.3;
    ditherRAF = requestAnimationFrame(ditherLoop);
  }

  function startDither() {
    if (!NX) resizeDither();
    ditherRunning = true;
    ditherCanvas.classList.add('visible');
    document.body.classList.add('dither-active');
    ditherLoop();
  }

  function stopDither() {
    ditherRunning = false;
    ditherCanvas.classList.remove('visible');
    document.body.classList.remove('dither-active');
    if (ditherRAF) { cancelAnimationFrame(ditherRAF); ditherRAF = null; }
  }

  hyphen.addEventListener('click', () => {
    ditherActive = !ditherActive;
    localStorage.setItem("dither", ditherActive ? "1" : "0");
    ditherActive ? startDither() : stopDither();
  });

  window.addEventListener('resize', () => {
    if (ditherActive) resizeDither();
  });

  window.addEventListener('beforeunload', () => {
    localStorage.setItem("ditherT", ditherT);
  });

  resizeDither();
  // Auto-start if it was active on a previous page
  if (localStorage.getItem("dither") === "1") {
    ditherActive = true;
    startDither();
  }
</script>
</body>
</html>
